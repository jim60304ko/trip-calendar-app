<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅行行程規劃</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            min-height: 600px;
        }

        .left-panel, .right-panel {
            padding: 30px;
        }

        .left-panel {
            border-right: 2px solid #f0f0f0;
        }

        .section-title {
            font-size: 1.5em;
            color: #667eea;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .add-form {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-full {
            width: 100%;
        }

        .itinerary-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .itinerary-item {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            transition: all 0.3s;
            cursor: move;
        }

        .itinerary-item:hover {
            border-color: #667eea;
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.2);
        }

        .itinerary-item.dragging {
            opacity: 0.5;
            transform: scale(0.95);
        }

        .itinerary-item.drag-over {
            border-color: #667eea;
            border-style: dashed;
            background: #f8f9ff;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .item-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            flex: 1;
        }

        .item-actions {
            display: flex;
            gap: 5px;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 1.2em;
            cursor: pointer;
            padding: 5px;
            border-radius: 5px;
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background: #f0f0f0;
        }

        .item-time {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .item-location {
            color: #666;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .item-location:hover {
            color: #667eea;
            text-decoration: underline;
        }

        .item-notes {
            color: #888;
            font-size: 0.9em;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #f0f0f0;
        }

        .calendar-view {
            background: #f8f9ff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .view-toggle {
            display: flex;
            gap: 5px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
        }

        .view-toggle button {
            background: transparent;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }

        .view-toggle button:hover {
            background: #f0f0f0;
        }

        .view-toggle button.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .calendar-nav {
            display: flex;
            gap: 10px;
        }

        .calendar-nav button {
            background: white;
            border: 2px solid #e0e0e0;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .calendar-nav button:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .calendar-day {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
            min-height: 80px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .calendar-day:hover {
            border-color: #667eea;
            transform: scale(1.02);
        }

        .calendar-day.has-events {
            background: linear-gradient(135deg, #f8f9ff 0%, #e8ebff 100%);
            border-color: #667eea;
        }

        .calendar-day.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .calendar-day.today {
            border: 3px solid #ffa726;
        }

        .day-number {
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .day-events {
            font-size: 0.75em;
            opacity: 0.8;
        }

        .week-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-bottom: 10px;
            font-weight: 600;
            text-align: center;
            color: #667eea;
        }

        .week-day-name {
            padding: 10px;
            background: white;
            border-radius: 8px;
        }

        .calendar-day.other-month {
            opacity: 0.3;
        }

        .day-detail-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .day-detail-header h3 {
            margin: 0;
            font-size: 1.3em;
        }

        .close-detail-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
        }

        .close-detail-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .day-event-card {
            background: #f8f9ff;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .day-event-card:hover {
            border-color: #667eea;
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.2);
        }

        .event-card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .event-card-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .event-card-time {
            background: white;
            color: #667eea;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.9em;
            font-weight: 600;
            border: 2px solid #667eea;
        }

        .event-card-location {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 10px 0;
            padding: 10px;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .event-card-location:hover {
            background: #667eea;
            color: white;
        }

        .event-card-location:hover .location-icon {
            transform: scale(1.2);
        }

        .location-icon {
            font-size: 1.2em;
            transition: transform 0.2s;
        }

        .event-card-notes {
            background: white;
            padding: 10px;
            border-radius: 8px;
            color: #666;
            font-size: 0.95em;
            margin-top: 10px;
            border-left: 3px solid #667eea;
        }

        .no-events-message {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .export-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
        }

        .export-btn {
            background: linear-gradient(135deg, #43a047 0%, #66bb6a 100%);
            width: 100%;
            margin-bottom: 10px;
        }

        .import-btn {
            background: linear-gradient(135deg, #1e88e5 0%, #42a5f5 100%);
            width: 100%;
            margin-bottom: 10px;
        }

        .lock-btn {
            background: linear-gradient(135deg, #ff6f00 0%, #ff8f00 100%);
            width: 100%;
        }

        .security-status {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .security-status.locked {
            border-color: #43a047;
            background: #e8f5e9;
        }

        .security-status.unlocked {
            border-color: #ff6f00;
            background: #fff3e0;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header-edit {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header-edit h2 {
            margin: 0;
            color: #667eea;
        }

        .drag-handle {
            cursor: move;
            font-size: 1.2em;
            color: #999;
            margin-right: 5px;
        }

        .item-title-row {
            display: flex;
            align-items: center;
        }

        .password-input-group {
            position: relative;
        }

        .password-input-group input {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2em;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: block;
            background: linear-gradient(135deg, #1e88e5 0%, #42a5f5 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
            text-align: center;
        }

        .file-input-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(30, 136, 229, 0.4);
        }

        .map-container {
            background: #f0f0f0;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            color: #666;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .map-container p {
            margin-top: 10px;
            font-size: 0.9em;
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: white;
            border: 2px solid #e0e0e0;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .left-panel {
                border-right: none;
                border-bottom: 2px solid #f0f0f0;
            }
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .calendar-grid {
                gap: 3px;
            }

            .calendar-day {
                min-height: 60px;
                padding: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✈️ 旅行行程規劃</h1>
            <p>輕鬆管理你的旅行計畫，整合行程與地圖</p>
        </div>

        <!-- 編輯行程 Modal -->
        <div class="modal-overlay" id="editModal">
            <div class="modal">
                <div class="modal-header-edit">
                    <h2>✏️ 編輯行程</h2>
                    <button class="icon-btn" onclick="closeEditModal()" style="font-size: 1.5em;">✕</button>
                </div>
                <div class="add-form">
                    <input type="hidden" id="editEventId">
                    <div class="form-group">
                        <label>行程名稱</label>
                        <input type="text" id="editEventTitle" placeholder="例如：參觀艾菲爾鐵塔">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>日期</label>
                            <input type="date" id="editEventDate">
                        </div>
                        <div class="form-group">
                            <label>時間</label>
                            <input type="time" id="editEventTime">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>地點</label>
                        <input type="text" id="editEventLocation" placeholder="例如：艾菲爾鐵塔, 巴黎">
                    </div>

                    <div class="form-group">
                        <label>類型</label>
                        <select id="editEventType">
                            <option value="attraction">景點</option>
                            <option value="food">美食</option>
                            <option value="hotel">住宿</option>
                            <option value="transport">交通</option>
                            <option value="shopping">購物</option>
                            <option value="other">其他</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>備註</label>
                        <textarea id="editEventNotes" placeholder="任何想記錄的事項..."></textarea>
                    </div>

                    <button class="btn btn-full" onclick="saveEdit()">💾 儲存變更</button>
                </div>
            </div>
        </div>

        <!-- 設定密碼 Modal -->
        <div class="modal-overlay" id="passwordModal">
            <div class="modal">
                <div class="modal-header-edit">
                    <h2>🔐 設定密碼保護</h2>
                    <button class="icon-btn" onclick="closePasswordModal()" style="font-size: 1.5em;">✕</button>
                </div>
                <div class="add-form">
                    <p style="margin-bottom: 15px; color: #666;">
                        設定密碼後，您的行程資料將會加密儲存在本地瀏覽器中，確保隱私安全。
                    </p>
                    
                    <div class="form-group">
                        <label>新密碼</label>
                        <div class="password-input-group">
                            <input type="password" id="newPassword" placeholder="請輸入至少 6 位數的密碼">
                            <button class="toggle-password" onclick="togglePasswordVisibility('newPassword')">👁️</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>確認密碼</label>
                        <div class="password-input-group">
                            <input type="password" id="confirmPassword" placeholder="再次輸入密碼">
                            <button class="toggle-password" onclick="togglePasswordVisibility('confirmPassword')">👁️</button>
                        </div>
                    </div>

                    <button class="btn btn-full" onclick="setPassword()">🔒 啟用密碼保護</button>
                </div>
            </div>
        </div>

        <!-- 解鎖 Modal -->
        <div class="modal-overlay" id="unlockModal">
            <div class="modal">
                <div class="modal-header-edit">
                    <h2>🔓 輸入密碼</h2>
                </div>
                <div class="add-form">
                    <p style="margin-bottom: 15px; color: #666;">
                        請輸入密碼以存取您的行程資料
                    </p>
                    
                    <div class="form-group">
                        <label>密碼</label>
                        <div class="password-input-group">
                            <input type="password" id="unlockPassword" placeholder="輸入密碼">
                            <button class="toggle-password" onclick="togglePasswordVisibility('unlockPassword')">👁️</button>
                        </div>
                    </div>

                    <button class="btn btn-full" onclick="unlockData()">🔓 解鎖</button>
                    <button class="btn btn-full" style="background: #999; margin-top: 10px;" onclick="resetAllData()">🗑️ 忘記密碼？清除所有資料</button>
                </div>
            </div>
        </div>

        <div class="main-content">
            <!-- 左側面板：新增行程 -->
            <div class="left-panel">
                <div class="section-title">📝 新增行程</div>
                
                <div class="add-form">
                    <div class="form-group">
                        <label>行程名稱</label>
                        <input type="text" id="eventTitle" placeholder="例如：參觀艾菲爾鐵塔">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>日期</label>
                            <input type="date" id="eventDate">
                        </div>
                        <div class="form-group">
                            <label>時間</label>
                            <input type="time" id="eventTime">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>地點</label>
                        <input type="text" id="eventLocation" placeholder="例如：艾菲爾鐵塔, 巴黎">
                    </div>

                    <div class="form-group">
                        <label>類型</label>
                        <select id="eventType">
                            <option value="attraction">景點</option>
                            <option value="food">美食</option>
                            <option value="hotel">住宿</option>
                            <option value="transport">交通</option>
                            <option value="shopping">購物</option>
                            <option value="other">其他</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>備註</label>
                        <textarea id="eventNotes" placeholder="任何想記錄的事項..."></textarea>
                    </div>

                    <button class="btn btn-full" onclick="addEvent()">➕ 新增行程</button>
                </div>

                <div class="section-title">📋 行程列表</div>
                
                <div class="filter-bar">
                    <button class="filter-btn active" onclick="filterEvents('all')">全部</button>
                    <button class="filter-btn" onclick="filterEvents('attraction')">景點</button>
                    <button class="filter-btn" onclick="filterEvents('food')">美食</button>
                    <button class="filter-btn" onclick="filterEvents('hotel')">住宿</button>
                    <button class="filter-btn" onclick="filterEvents('transport')">交通</button>
                </div>

                <div class="itinerary-list" id="itineraryList">
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>還沒有任何行程，開始新增吧！</p>
                    </div>
                </div>

                <div class="export-section">
                    <div class="security-status" id="securityStatus">
                        <span style="font-size: 1.5em;">🔓</span>
                        <div style="flex: 1;">
                            <strong>資料未加密</strong>
                            <div style="font-size: 0.85em; opacity: 0.7;">建議設定密碼保護</div>
                        </div>
                    </div>
                    
                    <button class="btn export-btn" onclick="exportToPDF()">📄 匯出 PDF 行程表</button>
                    <button class="btn export-btn" onclick="exportToJSON()">💾 匯出加密備份檔</button>
                    
                    <div class="file-input-wrapper">
                        <input type="file" id="importFile" accept=".json" onchange="importFromJSON(event)">
                        <label for="importFile" class="file-input-label">📂 匯入備份檔</label>
                    </div>
                    
                    <button class="btn lock-btn" onclick="openPasswordModal()" id="passwordBtn">🔐 設定密碼保護</button>
                </div>
            </div>

            <!-- 右側面板：行事曆與地圖 -->
            <div class="right-panel">
                <div class="section-title">📅 行事曆</div>
                
                <div class="calendar-view">
                    <div class="calendar-header">
                        <div class="view-toggle">
                            <button class="active" onclick="setCalendarView('month')">月</button>
                            <button onclick="setCalendarView('week')">週</button>
                        </div>
                        <h3 id="calendarMonth"></h3>
                        <div class="calendar-nav">
                            <button onclick="previousPeriod()">◀ 上一個</button>
                            <button onclick="today()">今天</button>
                            <button onclick="nextPeriod()">下一個 ▶</button>
                        </div>
                    </div>
                    <div class="week-header" id="weekHeader" style="display: none;">
                        <div class="week-day-name">日</div>
                        <div class="week-day-name">一</div>
                        <div class="week-day-name">二</div>
                        <div class="week-day-name">三</div>
                        <div class="week-day-name">四</div>
                        <div class="week-day-name">五</div>
                        <div class="week-day-name">六</div>
                    </div>
                    <div class="calendar-grid" id="calendarGrid"></div>
                </div>

                <div class="section-title" id="dayDetailTitle">🗺️ 地圖預覽</div>
                
                <div id="dayDetailContainer">
                    <div class="map-container" id="defaultMapView">
                        <div style="font-size: 3em;">🗺️</div>
                        <p>點擊行程中的地點，將自動開啟 Google Maps</p>
                        <p style="font-size: 0.85em; margin-top: 5px; opacity: 0.7;">
                            地圖整合功能可直接導航到目的地
                        </p>
                    </div>
                    <div id="dayEventsDetail" style="display: none;">
                        <div id="dayEventsList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let events = [];
        let currentFilter = 'all';
        let currentDate = new Date();
        let selectedDate = null;
        let calendarView = 'month'; // 'month' or 'week'
        let draggedElement = null;
        let draggedEventId = null;
        let isLocked = false;
        let currentPassword = null;

        const typeIcons = {
            attraction: '🏛️',
            food: '🍽️',
            hotel: '🏨',
            transport: '🚗',
            shopping: '🛍️',
            other: '📌'
        };

        const weekDays = ['日', '一', '二', '三', '四', '五', '六'];

        // 加密函數（使用 AES）
        async function encryptData(data, password) {
            const encoder = new TextEncoder();
            const dataBuffer = encoder.encode(JSON.stringify(data));
            const passwordBuffer = encoder.encode(password);
            
            // 使用密碼生成密鑰
            const keyMaterial = await crypto.subtle.importKey(
                'raw',
                passwordBuffer,
                { name: 'PBKDF2' },
                false,
                ['deriveBits', 'deriveKey']
            );
            
            const salt = crypto.getRandomValues(new Uint8Array(16));
            
            const key = await crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt: salt,
                    iterations: 100000,
                    hash: 'SHA-256'
                },
                keyMaterial,
                { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt']
            );
            
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const encryptedData = await crypto.subtle.encrypt(
                { name: 'AES-GCM', iv: iv },
                key,
                dataBuffer
            );
            
            // 組合 salt + iv + 加密資料
            const result = new Uint8Array(salt.length + iv.length + encryptedData.byteLength);
            result.set(salt, 0);
            result.set(iv, salt.length);
            result.set(new Uint8Array(encryptedData), salt.length + iv.length);
            
            return btoa(String.fromCharCode(...result));
        }

        // 解密函數
        async function decryptData(encryptedString, password) {
            try {
                const encryptedBytes = Uint8Array.from(atob(encryptedString), c => c.charCodeAt(0));
                
                const salt = encryptedBytes.slice(0, 16);
                const iv = encryptedBytes.slice(16, 28);
                const data = encryptedBytes.slice(28);
                
                const encoder = new TextEncoder();
                const passwordBuffer = encoder.encode(password);
                
                const keyMaterial = await crypto.subtle.importKey(
                    'raw',
                    passwordBuffer,
                    { name: 'PBKDF2' },
                    false,
                    ['deriveBits', 'deriveKey']
                );
                
                const key = await crypto.subtle.deriveKey(
                    {
                        name: 'PBKDF2',
                        salt: salt,
                        iterations: 100000,
                        hash: 'SHA-256'
                    },
                    keyMaterial,
                    { name: 'AES-GCM', length: 256 },
                    false,
                    ['decrypt']
                );
                
                const decryptedData = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv: iv },
                    key,
                    data
                );
                
                const decoder = new TextDecoder();
                return JSON.parse(decoder.decode(decryptedData));
            } catch (e) {
                throw new Error('密碼錯誤或資料損壞');
            }
        }

        // 載入儲存的資料
        function loadEvents() {
            const saved = localStorage.getItem('travelEvents');
            const passwordHash = localStorage.getItem('travelPasswordHash');
            
            if (passwordHash) {
                // 資料已加密，需要密碼解鎖
                isLocked = true;
                updateSecurityStatus();
                document.getElementById('unlockModal').classList.add('active');
            } else if (saved) {
                // 資料未加密
                events = JSON.parse(saved);
                renderEvents();
                renderCalendar();
            }
        }

        // 儲存資料
        async function saveEvents() {
            if (currentPassword) {
                // 加密儲存
                const encrypted = await encryptData(events, currentPassword);
                localStorage.setItem('travelEvents', encrypted);
            } else {
                // 明文儲存
                localStorage.setItem('travelEvents', JSON.stringify(events));
            }
        }

        // 更新安全狀態顯示
        function updateSecurityStatus() {
            const statusDiv = document.getElementById('securityStatus');
            const passwordBtn = document.getElementById('passwordBtn');
            
            if (currentPassword) {
                statusDiv.className = 'security-status locked';
                statusDiv.innerHTML = `
                    <span style="font-size: 1.5em;">🔒</span>
                    <div style="flex: 1;">
                        <strong>資料已加密</strong>
                        <div style="font-size: 0.85em; opacity: 0.7;">您的行程受密碼保護</div>
                    </div>
                `;
                passwordBtn.textContent = '🔓 移除密碼保護';
                passwordBtn.onclick = removePassword;
            } else {
                statusDiv.className = 'security-status unlocked';
                statusDiv.innerHTML = `
                    <span style="font-size: 1.5em;">🔓</span>
                    <div style="flex: 1;">
                        <strong>資料未加密</strong>
                        <div style="font-size: 0.85em; opacity: 0.7;">建議設定密碼保護</div>
                    </div>
                `;
                passwordBtn.textContent = '🔐 設定密碼保護';
                passwordBtn.onclick = openPasswordModal;
            }
        }

        // 開啟密碼設定視窗
        function openPasswordModal() {
            document.getElementById('passwordModal').classList.add('active');
        }

        // 關閉密碼設定視窗
        function closePasswordModal() {
            document.getElementById('passwordModal').classList.remove('active');
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
        }

        // 設定密碼
        async function setPassword() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!newPassword || newPassword.length < 6) {
                alert('密碼至少需要 6 個字元！');
                return;
            }

            if (newPassword !== confirmPassword) {
                alert('兩次輸入的密碼不一致！');
                return;
            }

            currentPassword = newPassword;
            
            // 儲存密碼雜湊（用於驗證）
            const passwordHash = await crypto.subtle.digest(
                'SHA-256',
                new TextEncoder().encode(newPassword)
            );
            localStorage.setItem('travelPasswordHash', btoa(String.fromCharCode(...new Uint8Array(passwordHash))));

            // 重新加密儲存資料
            await saveEvents();
            
            updateSecurityStatus();
            closePasswordModal();
            alert('密碼保護已啟用！請妥善保管您的密碼。');
        }

        // 解鎖資料
        async function unlockData() {
            const password = document.getElementById('unlockPassword').value;
            
            if (!password) {
                alert('請輸入密碼！');
                return;
            }

            try {
                const encrypted = localStorage.getItem('travelEvents');
                const decrypted = await decryptData(encrypted, password);
                
                events = decrypted;
                currentPassword = password;
                isLocked = false;
                
                document.getElementById('unlockModal').classList.remove('active');
                document.getElementById('unlockPassword').value = '';
                
                renderEvents();
                renderCalendar();
                updateSecurityStatus();
            } catch (e) {
                alert('密碼錯誤！請重試。');
            }
        }

        // 移除密碼保護
        function removePassword() {
            if (confirm('確定要移除密碼保護嗎？資料將以未加密方式儲存。')) {
                currentPassword = null;
                localStorage.removeItem('travelPasswordHash');
                saveEvents();
                updateSecurityStatus();
                alert('密碼保護已移除');
            }
        }

        // 重置所有資料
        function resetAllData() {
            if (confirm('警告：這將刪除所有資料且無法復原！確定要繼續嗎？')) {
                localStorage.clear();
                location.reload();
            }
        }

        // 切換密碼顯示
        function togglePasswordVisibility(inputId) {
            const input = document.getElementById(inputId);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        // 匯出為加密 JSON
        async function exportToJSON() {
            if (events.length === 0) {
                alert('目前沒有任何行程可以匯出！');
                return;
            }

            const password = prompt('請設定備份檔密碼（至少 6 位）：');
            
            if (!password || password.length < 6) {
                alert('密碼至少需要 6 個字元！');
                return;
            }

            const confirmPwd = prompt('請再次輸入密碼確認：');
            
            if (password !== confirmPwd) {
                alert('兩次輸入的密碼不一致！');
                return;
            }

            const encrypted = await encryptData(events, password);
            
            const dataStr = JSON.stringify({
                version: '1.0',
                encrypted: true,
                data: encrypted,
                exportDate: new Date().toISOString()
            }, null, 2);

            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Travel_Backup_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);

            alert('加密備份檔已匯出！請妥善保管密碼。');
        }

        // 從 JSON 匯入
        async function importFromJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    
                    if (!imported.encrypted) {
                        alert('不支援的檔案格式！');
                        return;
                    }

                    const password = prompt('請輸入備份檔密碼：');
                    if (!password) return;

                    const decrypted = await decryptData(imported.data, password);
                    
                    if (confirm(`確定要匯入 ${decrypted.length} 個行程嗎？這將覆蓋現有資料。`)) {
                        events = decrypted;
                        await saveEvents();
                        renderEvents();
                        renderCalendar();
                        alert('資料已成功匯入！');
                    }
                } catch (error) {
                    alert('匯入失敗：密碼錯誤或檔案損壞！');
                }
            };
            reader.readAsText(file);
            
            // 清空 input
            event.target.value = '';
        }

        // 新增行程
        function addEvent() {
            const title = document.getElementById('eventTitle').value.trim();
            const date = document.getElementById('eventDate').value;
            const time = document.getElementById('eventTime').value;
            const location = document.getElementById('eventLocation').value.trim();
            const type = document.getElementById('eventType').value;
            const notes = document.getElementById('eventNotes').value.trim();

            if (!title || !date || !location) {
                alert('請填寫行程名稱、日期和地點！');
                return;
            }

            const event = {
                id: Date.now(),
                title,
                date,
                time,
                location,
                type,
                notes
            };

            events.push(event);
            events.sort((a, b) => {
                const dateA = new Date(a.date + ' ' + (a.time || '00:00'));
                const dateB = new Date(b.date + ' ' + (b.time || '00:00'));
                return dateA - dateB;
            });

            saveEvents();
            renderEvents();
            renderCalendar();
            clearForm();
        }

        // 清空表單
        function clearForm() {
            document.getElementById('eventTitle').value = '';
            document.getElementById('eventDate').value = '';
            document.getElementById('eventTime').value = '';
            document.getElementById('eventLocation').value = '';
            document.getElementById('eventNotes').value = '';
            document.getElementById('eventType').value = 'attraction';
        }

        // 刪除行程
        function deleteEvent(id) {
            if (confirm('確定要刪除這個行程嗎？')) {
                events = events.filter(e => e.id !== id);
                saveEvents();
                renderEvents();
                renderCalendar();
                if (selectedDate) {
                    showDayDetail(selectedDate);
                }
            }
        }

        // 開啟編輯 Modal
        function editEvent(id) {
            const event = events.find(e => e.id === id);
            if (!event) return;

            document.getElementById('editEventId').value = event.id;
            document.getElementById('editEventTitle').value = event.title;
            document.getElementById('editEventDate').value = event.date;
            document.getElementById('editEventTime').value = event.time || '';
            document.getElementById('editEventLocation').value = event.location;
            document.getElementById('editEventType').value = event.type;
            document.getElementById('editEventNotes').value = event.notes || '';

            document.getElementById('editModal').classList.add('active');
        }

        // 關閉編輯 Modal
        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        // 儲存編輯
        function saveEdit() {
            const id = parseInt(document.getElementById('editEventId').value);
            const title = document.getElementById('editEventTitle').value.trim();
            const date = document.getElementById('editEventDate').value;
            const time = document.getElementById('editEventTime').value;
            const location = document.getElementById('editEventLocation').value.trim();
            const type = document.getElementById('editEventType').value;
            const notes = document.getElementById('editEventNotes').value.trim();

            if (!title || !date || !location) {
                alert('請填寫行程名稱、日期和地點！');
                return;
            }

            const eventIndex = events.findIndex(e => e.id === id);
            if (eventIndex !== -1) {
                events[eventIndex] = {
                    id,
                    title,
                    date,
                    time,
                    location,
                    type,
                    notes
                };

                events.sort((a, b) => {
                    const dateA = new Date(a.date + ' ' + (a.time || '00:00'));
                    const dateB = new Date(b.date + ' ' + (b.time || '00:00'));
                    return dateA - dateB;
                });

                saveEvents();
                renderEvents();
                renderCalendar();
                closeEditModal();
                
                if (selectedDate) {
                    showDayDetail(selectedDate);
                }

                alert('行程已更新！');
            }
        }

        // 拖曳開始
        function handleDragStart(e, id) {
            draggedElement = e.currentTarget;
            draggedEventId = id;
            e.currentTarget.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        // 拖曳結束
        function handleDragEnd(e) {
            e.currentTarget.classList.remove('dragging');
            document.querySelectorAll('.itinerary-item').forEach(item => {
                item.classList.remove('drag-over');
            });
        }

        // 拖曳經過
        function handleDragOver(e) {
            if (e.preventDefault) {
                e.preventDefault();
            }
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        // 拖曳進入
        function handleDragEnter(e) {
            if (e.currentTarget !== draggedElement) {
                e.currentTarget.classList.add('drag-over');
            }
        }

        // 拖曳離開
        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        // 放下
        function handleDrop(e, targetId) {
            if (e.stopPropagation) {
                e.stopPropagation();
            }

            e.currentTarget.classList.remove('drag-over');

            if (draggedEventId !== targetId) {
                const draggedIndex = events.findIndex(e => e.id === draggedEventId);
                const targetIndex = events.findIndex(e => e.id === targetId);

                if (draggedIndex !== -1 && targetIndex !== -1) {
                    const draggedEvent = events[draggedIndex];
                    events.splice(draggedIndex, 1);
                    events.splice(targetIndex, 0, draggedEvent);

                    saveEvents();
                    renderEvents();
                }
            }

            return false;
        }

        // 開啟 Google Maps
        function openMap(location) {
            const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(location)}`;
            window.open(url, '_blank');
        }

        // 渲染行程列表
        function renderEvents() {
            const container = document.getElementById('itineraryList');
            const filtered = currentFilter === 'all' 
                ? events 
                : events.filter(e => e.type === currentFilter);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>沒有符合條件的行程</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(event => `
                <div class="itinerary-item" 
                     draggable="true"
                     ondragstart="handleDragStart(event, ${event.id})"
                     ondragend="handleDragEnd(event)"
                     ondragover="handleDragOver(event)"
                     ondragenter="handleDragEnter(event)"
                     ondragleave="handleDragLeave(event)"
                     ondrop="handleDrop(event, ${event.id})">
                    <div class="item-header">
                        <div class="item-title-row">
                            <span class="drag-handle">⋮⋮</span>
                            <div class="item-title">
                                ${typeIcons[event.type]} ${event.title}
                            </div>
                        </div>
                        <div class="item-actions">
                            <button class="icon-btn" onclick="editEvent(${event.id})" title="編輯">✏️</button>
                            <button class="icon-btn" onclick="deleteEvent(${event.id})" title="刪除">🗑️</button>
                        </div>
                    </div>
                    <div class="item-time">
                        🕐 ${event.date} ${event.time ? event.time : ''}
                    </div>
                    <div class="item-location" onclick="openMap('${event.location}')">
                        📍 ${event.location} (點擊開啟地圖)
                    </div>
                    ${event.notes ? `<div class="item-notes">💭 ${event.notes}</div>` : ''}
                </div>
            `).join('');
        }

        // 篩選行程
        function filterEvents(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            renderEvents();
        }

        // 渲染行事曆
        function renderCalendar() {
            if (calendarView === 'month') {
                renderMonthView();
            } else {
                renderWeekView();
            }
        }

        // 渲染月視圖
        function renderMonthView() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            document.getElementById('calendarMonth').textContent = 
                `${year}年 ${month + 1}月`;
            document.getElementById('weekHeader').style.display = 'none';

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();
            const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            grid.style.gridTemplateColumns = 'repeat(7, 1fr)';

            // 空白天數
            for (let i = 0; i < firstDay; i++) {
                grid.innerHTML += '<div></div>';
            }

            // 日期
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayEvents = events.filter(e => e.date === dateStr);
                const hasEvents = dayEvents.length > 0;
                const isSelected = selectedDate === dateStr;
                const isToday = dateStr === todayStr;

                grid.innerHTML += `
                    <div class="calendar-day ${hasEvents ? 'has-events' : ''} ${isSelected ? 'selected' : ''} ${isToday ? 'today' : ''}" 
                         onclick="selectDate('${dateStr}')">
                        <div class="day-number">${day}</div>
                        ${hasEvents ? `<div class="day-events">${dayEvents.length} 個行程</div>` : ''}
                    </div>
                `;
            }
        }

        // 渲染週視圖
        function renderWeekView() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const date = currentDate.getDate();
            const today = new Date();
            const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

            // 計算這週的開始日期（週日）
            const currentDay = new Date(year, month, date);
            const dayOfWeek = currentDay.getDay();
            const weekStart = new Date(currentDay);
            weekStart.setDate(date - dayOfWeek);

            // 顯示週標題
            const weekEnd = new Date(weekStart);
            weekEnd.setDate(weekStart.getDate() + 6);
            
            document.getElementById('calendarMonth').textContent = 
                `${weekStart.getMonth() + 1}/${weekStart.getDate()} - ${weekEnd.getMonth() + 1}/${weekEnd.getDate()}, ${year}`;
            document.getElementById('weekHeader').style.display = 'grid';

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            grid.style.gridTemplateColumns = 'repeat(7, 1fr)';

            // 顯示這週的7天
            for (let i = 0; i < 7; i++) {
                const currentDayDate = new Date(weekStart);
                currentDayDate.setDate(weekStart.getDate() + i);
                
                const dateStr = `${currentDayDate.getFullYear()}-${String(currentDayDate.getMonth() + 1).padStart(2, '0')}-${String(currentDayDate.getDate()).padStart(2, '0')}`;
                const dayEvents = events.filter(e => e.date === dateStr);
                const hasEvents = dayEvents.length > 0;
                const isSelected = selectedDate === dateStr;
                const isToday = dateStr === todayStr;
                const isOtherMonth = currentDayDate.getMonth() !== currentDate.getMonth();

                grid.innerHTML += `
                    <div class="calendar-day ${hasEvents ? 'has-events' : ''} ${isSelected ? 'selected' : ''} ${isToday ? 'today' : ''} ${isOtherMonth ? 'other-month' : ''}" 
                         onclick="selectDate('${dateStr}')">
                        <div class="day-number">${currentDayDate.getDate()}</div>
                        ${hasEvents ? `<div class="day-events">${dayEvents.length} 個</div>` : ''}
                        ${dayEvents.length > 0 ? `<div style="font-size: 0.7em; margin-top: 5px;">${dayEvents.slice(0, 2).map(e => typeIcons[e.type]).join(' ')}</div>` : ''}
                    </div>
                `;
            }
        }

        // 切換視圖
        function setCalendarView(view) {
            calendarView = view;
            
            // 更新按鈕狀態
            document.querySelectorAll('.view-toggle button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            renderCalendar();
        }

        // 選擇日期
        function selectDate(dateStr) {
            selectedDate = dateStr;
            renderCalendar();
            showDayDetail(dateStr);
        }

        // 顯示當日詳細行程
        function showDayDetail(dateStr) {
            const dayEvents = events.filter(e => e.date === dateStr);
            const detailContainer = document.getElementById('dayEventsDetail');
            const defaultView = document.getElementById('defaultMapView');
            const title = document.getElementById('dayDetailTitle');
            
            if (dayEvents.length === 0) {
                detailContainer.style.display = 'none';
                defaultView.style.display = 'flex';
                title.textContent = '🗺️ 地圖預覽';
                return;
            }

            // 隱藏預設視圖，顯示詳細行程
            defaultView.style.display = 'none';
            detailContainer.style.display = 'block';

            // 格式化日期顯示
            const dateObj = new Date(dateStr);
            const weekDay = weekDays[dateObj.getDay()];
            const formattedDate = `${dateObj.getFullYear()}年${dateObj.getMonth() + 1}月${dateObj.getDate()}日 (${weekDay})`;
            
            title.textContent = `📅 ${formattedDate}`;

            // 渲染行程卡片
            const eventsList = document.getElementById('dayEventsList');
            eventsList.innerHTML = `
                <div class="day-detail-header">
                    <h3>共 ${dayEvents.length} 個行程</h3>
                    <button class="close-detail-btn" onclick="closeDayDetail()">✕ 關閉</button>
                </div>
                ${dayEvents.map(event => `
                    <div class="day-event-card">
                        <div class="event-card-header">
                            <div class="event-card-title">
                                <span style="font-size: 1.3em;">${typeIcons[event.type]}</span>
                                <span>${event.title}</span>
                            </div>
                            <div class="event-card-time">
                                ${event.time ? event.time : '未設定時間'}
                            </div>
                        </div>
                        <div class="event-card-location" onclick="openMap('${event.location}')">
                            <span class="location-icon">📍</span>
                            <span style="flex: 1;">${event.location}</span>
                            <span style="font-size: 0.9em; opacity: 0.7;">點擊開啟地圖 →</span>
                        </div>
                        ${event.notes ? `
                            <div class="event-card-notes">
                                <strong>💭 備註：</strong><br>
                                ${event.notes}
                            </div>
                        ` : ''}
                    </div>
                `).join('')}
            `;
        }

        // 關閉當日詳細行程
        function closeDayDetail() {
            selectedDate = null;
            document.getElementById('dayEventsDetail').style.display = 'none';
            document.getElementById('defaultMapView').style.display = 'flex';
            document.getElementById('dayDetailTitle').textContent = '🗺️ 地圖預覽';
            renderCalendar();
        }

        // 匯出 PDF
        async function exportToPDF() {
            if (events.length === 0) {
                alert('目前沒有任何行程可以匯出！');
                return;
            }

            // 按日期分組行程
            const groupedEvents = {};
            events.forEach(event => {
                if (!groupedEvents[event.date]) {
                    groupedEvents[event.date] = [];
                }
                groupedEvents[event.date].push(event);
            });

            const sortedDates = Object.keys(groupedEvents).sort();

            // 建立 PDF 內容
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // 設定字體（使用內建字體）
            doc.setFont("helvetica");
            
            let yPos = 20;
            const pageHeight = doc.internal.pageSize.height;
            const margin = 20;

            // 標題
            doc.setFontSize(20);
            doc.text('Travel Itinerary', margin, yPos);
            yPos += 15;

            doc.setFontSize(10);
            doc.text(`Generated: ${new Date().toLocaleDateString('zh-TW')}`, margin, yPos);
            yPos += 15;

            // 遍歷每一天
            sortedDates.forEach((date, dateIndex) => {
                const dateObj = new Date(date);
                const weekDay = weekDays[dateObj.getDay()];
                const dayEvents = groupedEvents[date];

                // 檢查是否需要換頁
                if (yPos > pageHeight - 60) {
                    doc.addPage();
                    yPos = 20;
                }

                // 日期標題
                doc.setFillColor(102, 126, 234);
                doc.rect(margin, yPos - 5, 170, 10, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(14);
                doc.text(`${date} (${weekDay})`, margin + 3, yPos + 3);
                doc.setTextColor(0, 0, 0);
                yPos += 15;

                // 該日期的行程
                dayEvents.forEach((event, eventIndex) => {
                    // 檢查是否需要換頁
                    if (yPos > pageHeight - 40) {
                        doc.addPage();
                        yPos = 20;
                    }

                    doc.setFontSize(11);
                    
                    // 時間和標題
                    const timeText = event.time || '--:--';
                    doc.setFont("helvetica", "bold");
                    doc.text(`${timeText}  ${event.title}`, margin + 5, yPos);
                    yPos += 7;

                    // 地點
                    doc.setFont("helvetica", "normal");
                    doc.setFontSize(9);
                    doc.text(`Location: ${event.location}`, margin + 10, yPos);
                    yPos += 6;

                    // 類型
                    const typeLabels = {
                        attraction: 'Attraction',
                        food: 'Food',
                        hotel: 'Hotel',
                        transport: 'Transport',
                        shopping: 'Shopping',
                        other: 'Other'
                    };
                    doc.text(`Type: ${typeLabels[event.type]}`, margin + 10, yPos);
                    yPos += 6;

                    // 備註
                    if (event.notes) {
                        doc.text(`Notes: ${event.notes}`, margin + 10, yPos, {
                            maxWidth: 160
                        });
                        yPos += 8;
                    }

                    // 分隔線
                    if (eventIndex < dayEvents.length - 1) {
                        doc.setDrawColor(200, 200, 200);
                        doc.line(margin + 5, yPos, 190, yPos);
                        yPos += 5;
                    }
                });

                yPos += 10;
            });

            // 統計資訊
            if (yPos > pageHeight - 40) {
                doc.addPage();
                yPos = 20;
            }

            doc.setFontSize(10);
            doc.setFont("helvetica", "bold");
            doc.text('Summary:', margin, yPos);
            yPos += 7;
            doc.setFont("helvetica", "normal");
            doc.text(`Total Events: ${events.length}`, margin, yPos);
            yPos += 6;
            doc.text(`Total Days: ${sortedDates.length}`, margin, yPos);

            // 儲存 PDF
            const fileName = `Travel_Itinerary_${new Date().toISOString().split('T')[0]}.pdf`;
            doc.save(fileName);

            alert('PDF 已成功匯出！');
        }

        // 上一個時期（月或週）
        function previousPeriod() {
            if (calendarView === 'month') {
                currentDate.setMonth(currentDate.getMonth() - 1);
            } else {
                currentDate.setDate(currentDate.getDate() - 7);
            }
            renderCalendar();
        }

        // 下一個時期（月或週）
        function nextPeriod() {
            if (calendarView === 'month') {
                currentDate.setMonth(currentDate.getMonth() + 1);
            } else {
                currentDate.setDate(currentDate.getDate() + 7);
            }
            renderCalendar();
        }

        // 回到今天
        function today() {
            currentDate = new Date();
            selectedDate = null;
            renderCalendar();
        }

        // 上一個月（保留向後相容）
        function previousMonth() {
            previousPeriod();
        }

        // 下一個月（保留向後相容）
        function nextMonth() {
            nextPeriod();
        }

        // 初始化
        document.getElementById('eventDate').valueAsDate = new Date();
        loadEvents();
        renderCalendar();
        updateSecurityStatus();
    </script>
</body>
</html>
